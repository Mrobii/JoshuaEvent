<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joshua Events - Create • Plan • Celebrate</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="JoshuaEvents.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            position: relative;
            overflow: hidden;
        }

        #app::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 6s ease-in-out infinite;
        }

        #app::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08), transparent);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .loading-logo {
            width: 220px;
            height: 220px;
            margin-bottom: 2.5rem;
            animation: logoEntrance 1s ease-out, logoFloat 3s ease-in-out 1s infinite;
            background: white;
            border-radius: 50%;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        @keyframes logoEntrance {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .loading-brand {
            text-align: center;
            color: white;
            animation: fadeInUp 1s ease-out 0.5s both;
            position: relative;
            z-index: 1;
        }

        .loading-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .loading-brand .tagline {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.95;
        }

        .loading-brand .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            opacity: 0.9;
            font-style: italic;
            font-weight: 700;
            color: #fbbf24;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-progress {
            position: relative;
            display: block;
            width: 9rem;
            height: 9rem;
            margin: 2.5rem auto 0 auto;
            z-index: 1;
        }

        .loading-progress circle {
            fill: none;
            stroke: rgba(255,255,255,0.2);
            stroke-width: 0.5rem;
            transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }

        .loading-progress circle:last-child {
            stroke: #fbbf24;
            stroke-dasharray: calc(3.141 * var(--blazor-load-percentage, 0%) * 0.8), 500%;
            transition: stroke-dasharray 0.05s ease-in-out;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px #fbbf24);
        }

        .loading-progress-text {
            position: relative;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            color: white;
            margin-top: 1.5rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            z-index: 1;
        }
        }

        .loading-progress-text:after {
            content: var(--blazor-load-percentage-text, "Loading");
        }
    </style>
</head>

<body>
    <div id="app">
        <img src="images/joshua-logo.svg" alt="Joshua Events Logo" class="loading-logo" />
        <div class="loading-brand">
            <h1>JOSHUA EVENTS</h1>
            <div class="tagline">CREATE • PLAN • CELEBRATE</div>
            <div class="subtitle">We Create Moments You'll Cherish Forever</div>
        </div>
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Convert file to Base64 for storage
        window.convertFileToBase64 = function (inputId) {
            return new Promise((resolve, reject) => {
                const input = document.getElementById(inputId);
                if (!input || !input.files || input.files.length === 0) {
                    reject('No file selected');
                    return;
                }

                const file = input.files[0];

                // Check file type
                if (!file.type.startsWith('image/')) {
                    reject('Please select an image file');
                    return;
                }

                // Check file size (5MB limit)
                if (file.size > 5 * 1024 * 1024) {
                    reject('File size must be less than 5MB');
                    return;
                }

                const reader = new FileReader();

                reader.onload = function(e) {
                    resolve(e.target.result);
                };

                reader.onerror = function(error) {
                    reject('Error reading file: ' + error);
                };

                reader.readAsDataURL(file);
            });
        };

        // Export photos data to JSON file
        window.exportPhotosToJson = function() {
            const photos = localStorage.getItem('joshuaevents_photos');
            if (!photos) {
                alert('No photos to export');
                return;
            }

            const blob = new Blob([photos], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'joshua-events-photos-' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // Import photos data from JSON file
        window.importPhotosFromJson = function(inputId) {
            return new Promise((resolve, reject) => {
                const input = document.getElementById(inputId);
                if (!input || !input.files || input.files.length === 0) {
                    reject('No file selected');
                    return;
                }

                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        localStorage.setItem('joshuaevents_photos', JSON.stringify(data));
                        resolve('Photos imported successfully');
                    } catch (error) {
                        reject('Invalid JSON file');
                    }
                };

                reader.onerror = function() {
                    reject('Error reading file');
                };

                reader.readAsText(file);
            });
        };
    </script>
</body>

</html>
