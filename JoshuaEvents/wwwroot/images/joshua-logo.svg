<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
	<style>
	  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&amp;family=Montserrat:wght@400;500&amp;display=swap');
	  .logo-je { font-family: 'Poppins', sans-serif; font-weight: 900; }
	  .logo-name { font-family: 'Montserrat', sans-serif; font-weight: 500; }
	  .logo-tagline { font-family: 'Montserrat', sans-serif; font-weight: 400; }
	</style>

	<!-- Modern gradients -->
	<linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
	  <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
	  <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
	</linearGradient>

	<linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
	  <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
	  <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
	</linearGradient>

	<!-- Modern shadow -->
	<filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
	  <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
	  <feOffset dx="0" dy="2" result="offsetblur"/>
	  <feComponentTransfer>
		<feFuncA type="linear" slope="0.3"/>
	  </feComponentTransfer>
	  <feMerge>
		<feMergeNode/>
		<feMergeNode in="SourceGraphic"/>
	  </feMerge>
	</filter>
  </defs>

  <!-- Clean white background circle with subtle shadow -->
  <circle cx="200" cy="200" r="195" fill="white" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Modern colorful flower - positioned perfectly to the right of JE -->
  <!-- Pink petal (top left) -->
  <ellipse cx="265" cy="135" rx="10" ry="28" fill="#ec4899" opacity="0.95" transform="rotate(-30 265 135)"/>

  <!-- Hot Pink petal -->
  <ellipse cx="280" cy="145" rx="10" ry="26" fill="#db2777" opacity="0.95" transform="rotate(-10 280 145)"/>

  <!-- Orange petal -->
  <ellipse cx="292" cy="160" rx="10" ry="25" fill="#f97316" opacity="0.95" transform="rotate(10 292 160)"/>

  <!-- Yellow petal -->
  <ellipse cx="298" cy="178" rx="10" ry="24" fill="#facc15" opacity="0.95" transform="rotate(25 298 178)"/>

  <!-- Light green petal -->
  <ellipse cx="296" cy="197" rx="10" ry="23" fill="#84cc16" opacity="0.95" transform="rotate(40 296 197)"/>

  <!-- Green petal -->
  <ellipse cx="285" cy="213" rx="10" ry="22" fill="#22c55e" opacity="0.95" transform="rotate(55 285 213)"/>

  <!-- Teal petal -->
  <ellipse cx="270" cy="225" rx="10" ry="21" fill="#14b8a6" opacity="0.95" transform="rotate(70 270 225)"/>

  <!-- Blue petal (bottom) -->
  <ellipse cx="252" cy="232" rx="10" ry="20" fill="#3b82f6" opacity="0.95" transform="rotate(85 252 232)"/>

  <!-- Modern sparkles -->
  <circle cx="285" cy="128" r="3" fill="#ec4899" opacity="0.8"/>
  <circle cx="302" cy="148" r="2.5" fill="#f97316" opacity="0.8"/>
  <circle cx="310" cy="175" r="3" fill="#facc15" opacity="0.8"/>
  <circle cx="308" cy="205" r="2.5" fill="#22c55e" opacity="0.8"/>
  <circle cx="290" cy="235" r="3" fill="#3b82f6" opacity="0.8"/>

  <!-- Star sparkles -->
  <path d="M 295 122 L 296 125 L 299 126 L 296 127 L 295 130 L 294 127 L 291 126 L 294 125 Z" fill="#db2777" opacity="0.9"/>
  <path d="M 312 190 L 313 193 L 316 194 L 313 195 L 312 198 L 311 195 L 308 194 L 311 193 Z" fill="#84cc16" opacity="0.9"/>

  <!-- JE monogram - Modern bold font, perfectly aligned -->
  <text x="130" y="210" class="logo-je" font-size="110" fill="url(#blueGradient)" letter-spacing="-8" filter="url(#softShadow)">JE</text>

  <!-- JOSHUA text - Modern, clean -->
  <text x="200" y="270" class="logo-name" font-size="52" fill="#0f172a" text-anchor="middle" letter-spacing="10">JOSHUA</text>

  <!-- Modern decorative line under JOSHUA -->
  <path d="M 90 285 Q 200 292 310 285" stroke="url(#pinkGradient)" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- EVENTS text -->
  <text x="200" y="320" class="logo-name" font-size="34" fill="#334155" text-anchor="middle" letter-spacing="8">EVENTS</text>

  <!-- Subtle separator -->
  <circle cx="200" cy="340" r="2" fill="#cbd5e1"/>
  <circle cx="185" cy="340" r="1.5" fill="#cbd5e1"/>
  <circle cx="215" cy="340" r="1.5" fill="#cbd5e1"/>

  <!-- Modern tagline -->
  <text x="200" y="362" class="logo-tagline" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="3" font-weight="500">CREATE + PLAN + CELEBRATE</text>
</svg>
