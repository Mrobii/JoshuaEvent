<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
	<style>
	  .logo-text { font-family: 'Georgia', serif; font-weight: bold; }
	  .tagline { font-family: Arial, sans-serif; letter-spacing: 1px; }
	</style>
	<linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
	  <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
	  <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
	</linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="145" fill="white" stroke="#e5e7eb" stroke-width="3"/>

  <!-- Colorful flower petals around JL -->
  <!-- Top petal - Pink/Red -->
  <path d="M 150 80 Q 165 65 175 75 Q 180 85 170 95 Q 160 95 150 90 Z" fill="#e91e63"/>
  <!-- Right top petal - Orange -->
  <path d="M 170 95 Q 190 90 200 105 Q 200 120 185 125 Q 175 120 170 110 Z" fill="#ff9800"/>
  <!-- Right bottom petal - Green -->
  <path d="M 170 130 Q 185 145 180 160 Q 170 170 155 160 Q 155 145 160 135 Z" fill="#4caf50"/>
  <!-- Bottom petal - Blue -->
  <path d="M 150 160 Q 145 175 130 180 Q 115 175 115 160 Q 125 150 140 150 Z" fill="#2196f3"/>
  <!-- Left petal - Purple -->
  <path d="M 130 110 Q 110 115 100 100 Q 100 85 115 80 Q 125 85 130 95 Z" fill="#9c27b0"/>

  <!-- Center circle -->
  <circle cx="150" cy="115" r="15" fill="#fbbf24"/>

  <!-- JL text -->
  <text x="90" y="140" class="logo-text" font-size="56" fill="url(#blueGrad)" font-weight="900">JL</text>

  <!-- JOSHUA text -->
  <text x="150" y="200" class="logo-text" font-size="42" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">JOSHUA</text>

  <!-- EVENTS text -->
  <text x="150" y="235" class="tagline" font-size="24" fill="#2c6e49" text-anchor="middle" font-weight="600">EVENTS</text>

  <!-- Decorative line -->
  <line x1="80" y1="245" x2="220" y2="245" stroke="#d1d5db" stroke-width="2"/>

  <!-- Tagline -->
  <text x="150" y="268" class="tagline" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="500">CREATE • PLAN • CELEBRATE</text>
</svg>
