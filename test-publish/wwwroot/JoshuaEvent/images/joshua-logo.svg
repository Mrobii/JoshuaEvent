<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
	<style>
	  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=Poppins:wght@400;500;600&amp;display=swap');
	  .logo-je { font-family: 'Playfair Display', serif; font-weight: 700; }
	  .logo-name { font-family: 'Poppins', sans-serif; font-weight: 600; }
	  .logo-events { font-family: 'Poppins', sans-serif; font-weight: 500; }
	  .logo-tagline { font-family: 'Poppins', sans-serif; font-weight: 400; }
	</style>
  </defs>

  <!-- Clean white background circle -->
  <circle cx="200" cy="200" r="198" fill="white"/>

  <!-- LARGE PROMINENT colorful flower petals - Rainbow style matching original -->
  <!-- Magenta/Pink petal (top-left) -->
  <ellipse cx="262" cy="105" rx="20" ry="60" fill="#d946a8" transform="rotate(-40 262 105)"/>

  <!-- Hot Pink petal -->
  <ellipse cx="288" cy="118" rx="20" ry="58" fill="#ec4899" transform="rotate(-20 288 118)"/>

  <!-- Orange petal -->
  <ellipse cx="308" cy="140" rx="20" ry="56" fill="#f97316" transform="rotate(0 308 140)"/>

  <!-- Yellow petal -->
  <ellipse cx="320" cy="168" rx="20" ry="54" fill="#fbbf24" transform="rotate(20 320 168)"/>

  <!-- Light green/Lime petal -->
  <ellipse cx="322" cy="198" rx="20" ry="52" fill="#a3e635" transform="rotate(40 322 198)"/>

  <!-- Green petal -->
  <ellipse cx="312" cy="226" rx="20" ry="50" fill="#22c55e" transform="rotate(60 312 226)"/>

  <!-- Teal/Cyan petal -->
  <ellipse cx="290" cy="248" rx="20" ry="48" fill="#14b8a6" transform="rotate(80 290 248)"/>

  <!-- Blue petal -->
  <ellipse cx="262" cy="262" rx="20" ry="46" fill="#3b82f6" transform="rotate(100 262 262)"/>

  <!-- Sparkles around the flower - larger and more visible -->
  <circle cx="280" cy="90" r="5" fill="#ec4899"/>
  <circle cx="315" cy="120" r="4.5" fill="#f97316"/>
  <circle cx="335" cy="165" r="5" fill="#fbbf24"/>
  <circle cx="338" cy="210" r="4.5" fill="#22c55e"/>
  <circle cx="320" cy="255" r="5" fill="#14b8a6"/>
  <circle cx="278" cy="275" r="4.5" fill="#3b82f6"/>

  <!-- Star sparkles - larger -->
  <path d="M 295 82 L 297 88 L 303 90 L 297 92 L 295 98 L 293 92 L 287 90 L 293 88 Z" fill="#d946a8"/>
  <path d="M 345 185 L 347 191 L 353 193 L 347 195 L 345 201 L 343 195 L 337 193 L 343 191 Z" fill="#a3e635"/>
  <path d="M 290 283 L 292 289 L 298 291 L 292 293 L 290 299 L 288 293 L 282 291 L 288 289 Z" fill="#8b5cf6"/>

  <!-- JE monogram - Serif font matching original -->
  <text x="95" y="210" class="logo-je" font-size="115" fill="#1e293b" letter-spacing="-5">JE</text>

  <!-- JOSHUA text - Bold, dark -->
  <text x="200" y="275" class="logo-name" font-size="46" fill="#1e293b" text-anchor="middle" letter-spacing="7">JOSHUA</text>

  <!-- EVENTS text - Light blue/purple to match original -->
  <text x="200" y="312" class="logo-events" font-size="28" fill="#a5b4fc" text-anchor="middle" letter-spacing="5">EVENTS</text>

  <!-- Decorative dots separator -->
  <circle cx="200" cy="328" r="2" fill="#94a3b8"/>
  <circle cx="185" cy="328" r="2" fill="#94a3b8"/>
  <circle cx="215" cy="328" r="2" fill="#94a3b8"/>

  <!-- Tagline -->
  <text x="200" y="350" class="logo-tagline" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="2">CREATE • PLAN • CELEBRATE</text>
</svg>
