name: Deploy Joshua Events to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JoshuaEvents/JoshuaEvents.csproj

      - name: Build
        run: dotnet build JoshuaEvents/JoshuaEvents.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish JoshuaEvents/JoshuaEvents.csproj -c Release -o publish --no-build

      - name: Update base tag for GitHub Pages
        run: |
          # Find the actual index.html location and update it
          if [ -f publish/wwwroot/wwwroot/JoshuaEvent-s/index.html ]; then
            echo "Found index.html in publish/wwwroot/wwwroot/JoshuaEvent-s/"
            sed -i 's|<base href="/" />|<base href="/JoshuaEvent/" />|g' publish/wwwroot/wwwroot/JoshuaEvent-s/index.html
          elif [ -f publish/wwwroot/index.html ]; then
            echo "Found index.html in publish/wwwroot/"
            sed -i 's|<base href="/" />|<base href="/JoshuaEvent/" />|g' publish/wwwroot/index.html
          else
            echo "ERROR: Cannot find index.html"
            exit 1
          fi

      - name: Verify base tag update
        run: |
          echo "Checking publish structure:"
          ls -la publish/wwwroot/ | head -15
          echo ""
          echo "Checking for nested wwwroot:"
          ls -la publish/wwwroot/wwwroot/ || echo "No nested wwwroot"
          echo ""
          echo "Looking for actual files location:"
          find publish/wwwroot -name "blazor.webassembly*.js" -o -name "app.css" | head -5
          echo ""
          echo "Verifying base tag was updated to /JoshuaEvent/:"
          grep '<base href="/JoshuaEvent/" />' publish/wwwroot/index.html 2>/dev/null || grep '<base href="/JoshuaEvent/" />' publish/wwwroot/wwwroot/JoshuaEvent-s/index.html 2>/dev/null || echo "ERROR: Base tag not found!"

      - name: Determine upload path
        id: upload-path
        run: |
          if [ -d publish/wwwroot/wwwroot/JoshuaEvent-s ]; then
            echo "path=publish/wwwroot/wwwroot/JoshuaEvent-s" >> $GITHUB_OUTPUT
            echo "Uploading from: publish/wwwroot/wwwroot/JoshuaEvent-s"
          elif [ -d publish/wwwroot/_framework ]; then
            echo "path=publish/wwwroot" >> $GITHUB_OUTPUT
            echo "Uploading from: publish/wwwroot"
          else
            echo "ERROR: Cannot find published files"
            ls -la publish/wwwroot
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.upload-path.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
