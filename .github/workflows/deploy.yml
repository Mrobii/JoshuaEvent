name: Deploy Joshua Events to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JoshuaEvents/JoshuaEvents.csproj

      - name: Build
        run: dotnet build JoshuaEvents/JoshuaEvents.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish JoshuaEvents/JoshuaEvents.csproj -c Release -o publish

      - name: Update base tag for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/JoshuaEvent/" />|g' publish/wwwroot/index.html

      - name: Verify deployment files
        run: |
          echo "=== Files in publish/wwwroot ==="
          ls -la publish/wwwroot/ | head -20
          echo ""
          echo "=== Checking key files exist ==="
          ls -la publish/wwwroot/_framework/ | head -10
          ls -la publish/wwwroot/css/
          echo ""
          echo "=== Verifying base tag ===" 
          grep '<base href="/JoshuaEvent/" />' publish/wwwroot/index.html && echo "? Base tag updated correctly" || echo "? ERROR: Base tag not updated!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
