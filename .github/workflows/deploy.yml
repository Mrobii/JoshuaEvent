name: Deploy Joshua Events to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JoshuaEvents/JoshuaEvents.csproj

      - name: Build
        run: dotnet build JoshuaEvents/JoshuaEvents.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish JoshuaEvents/JoshuaEvents.csproj -c Release -o publish

      - name: Update base tag for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/JoshuaEvent/" />|g' publish/wwwroot/index.html

      - name: Ensure .nojekyll exists
        run: |
          touch publish/wwwroot/.nojekyll
          echo "? .nojekyll file created/verified"

      - name: Verify deployment files
        run: |
          echo "=== Files in publish/wwwroot ==="
          ls -la publish/wwwroot/ | head -20
          echo ""
          echo "=== Checking _framework folder ==="
          if [ -d "publish/wwwroot/_framework" ]; then
            echo "? _framework folder exists"
            echo "Total files in _framework: $(find publish/wwwroot/_framework -type f | wc -l)"
            echo "Sample _framework files:"
            ls -la publish/wwwroot/_framework/ | head -15
          else
            echo "? ERROR: _framework folder does NOT exist!"
            exit 1
          fi
          echo ""
          echo "=== Checking for blazor files ==="
          find publish/wwwroot/_framework -name "blazor*" -type f || echo "No blazor files found!"
          echo ""
          echo "=== Verifying .nojekyll ==="
          if [ -f "publish/wwwroot/.nojekyll" ]; then
            echo "? .nojekyll exists at root"
          else
            echo "? WARNING: .nojekyll missing!"
          fi
          echo ""
          echo "=== Total size of wwwroot ==="
          du -sh publish/wwwroot/
          echo ""
          echo "=== Size of _framework ==="
          du -sh publish/wwwroot/_framework/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot
          retention-days: 1
        env:
          # Ensure underscore folders are included
          RUNNER_TEMP: ${{ runner.temp }}

      - name: List uploaded artifact contents
        run: |
          echo "=== Verifying what will be deployed ==="
          echo "Artifact should contain _framework folder with $(find publish/wwwroot/_framework -type f | wc -l) files"
          echo ""
          echo "=== Directory structure to be deployed ==="
          tree -L 2 publish/wwwroot/ || find publish/wwwroot/ -maxdepth 2 -type d
          echo ""
          echo "=== Checking if _framework will be preserved ==="
          ls -la publish/wwwroot/ | grep "_framework" && echo "? _framework folder present" || echo "? _framework folder missing!"
          echo "=== Verifying what will be deployed ==="
          echo "Artifact should contain _framework folder with $(find publish/wwwroot/_framework -type f | wc -l) files"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
