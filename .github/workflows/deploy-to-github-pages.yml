name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    # Checkout the code
    - uses: actions/checkout@v4

    # Install .NET 10 SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore JoshuaEvents/JoshuaEvents.csproj

    # Publish the app
    - name: Publish .NET Project
      run: dotnet publish JoshuaEvents/JoshuaEvents.csproj -c Release -o release --nologo

    # Change base-tag in index.html from '/' to 'JoshuaEvent-s' to match GitHub Pages repository name
    - name: Change base-tag in index.html
      run: sed -i 's/<base href="\/" \/>/<base href="\/JoshuaEvent-s\/" \/>/g' release/wwwroot/index.html

    # Add .nojekyll file to tell GitHub Pages to not treat this as a Jekyll project
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    # Upload artifact for GitHub Pages
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
