name: Deploy to GitHub Pages (DISABLED)

# Disabled - using deploy.yml instead
on:
  workflow_dispatch:

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    # Checkout the code
    - uses: actions/checkout@v4

    # Install .NET 10 SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore JoshuaEvents/JoshuaEvents.csproj

    # Publish the app
    - name: Publish .NET Project
      run: dotnet publish JoshuaEvents/JoshuaEvents.csproj -c Release -o release --nologo

    # Change base-tag in index.html from '/' to 'JoshuaEvent-s' to match GitHub Pages repository name
    - name: Change base-tag in index.html
      run: sed -i 's/<base href="\/" \/>/<base href="\/JoshuaEvent-s\/" \/>/g' release/wwwroot/index.html

    # Add .nojekyll file to tell GitHub Pages to not treat this as a Jekyll project
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    # Copy 404.html for SPA routing (it should already be there from wwwroot)
    - name: Verify 404.html exists
      run: |
        if [ ! -f release/wwwroot/404.html ]; then
          echo "404.html not found, creating it"
          cat > release/wwwroot/404.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8" />
            <title>Joshua Events</title>
            <script>
                var pathSegmentsToKeep = 1;
                var l = window.location;
                l.replace(
                    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
                );
            </script>
        </head>
        <body>
        </body>
        </html>
        EOF
        fi

    # Upload artifact for GitHub Pages
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
